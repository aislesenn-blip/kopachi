        // 1. World-Class Interactive Gallery (Masonry + Fullscreen Slider)
        const MasonryGallery = ({ images, onClose }) => {
            const [selectedIndex, setSelectedIndex] = useState(null);

            useEffect(() => {
                lucide.createIcons();
                const handleKeyDown = (e) => { 
                    if (e.key === 'Escape') {
                        if (selectedIndex !== null) setSelectedIndex(null);
                        else onClose();
                    }
                    if (selectedIndex !== null) {
                        if (e.key === 'ArrowRight') setSelectedIndex(prev => (prev + 1) % images.length);
                        if (e.key === 'ArrowLeft') setSelectedIndex(prev => (prev === 0 ? images.length - 1 : prev - 1));
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', handleKeyDown); document.body.style.overflow = 'auto'; };

        // 2. Global UseScroll Reveal Hook (Fixed Blank Page Bug)
        const useScrollReveal = (deps = []) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    const observer = new IntersectionObserver((entries, obs) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('animate-reveal');
                                obs.unobserve(entry.target); 
                            }
                        });
                    }, { threshold: 0.1 });
                    
                    document.querySelectorAll('.reveal-on-scroll').forEach(el => {
                        el.classList.remove('animate-reveal'); 
                        observer.observe(el);
                    });
                    
                    return () => observer.disconnect();
                }, 100);
                return () => clearTimeout(timer);
            }, deps);
        };

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16">
                                        {projects.map(proj => (
                                            <div key={proj.id} onClick={() => handleSelect(proj)} className="bg-white/5 border border-white/10 rounded-sm overflow-hidden hover:border-brand-brick transition-all duration-500 cursor-pointer group reveal-on-scroll">
                                                <div className="h-96 overflow-hidden relative">
                                                    <SafeImage src={proj.cover} alt={proj.name} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />
                                                    <div className="absolute inset-0 bg-brand-dark/30 group-hover:bg-transparent transition-colors"></div>
                                                </div>
                                                <div className="p-16">
                                                    <h3 className="text-4xl font-serif mb-6">{proj.name}</h3>
                                                    <p className="text-brand-gold mb-8 uppercase tracking-widest text-lg font-bold">{proj.location} • {proj.duration}</p>
                                                    <p className="text-gray-400 text-xl line-clamp-3 font-light leading-relaxed">{proj.desc}</p>
                                                    <button type="button" className="mt-10 text-brand-brick font-bold uppercase text-lg tracking-[0.2em] group-hover:text-white transition-colors flex items-center gap-3">View Initiative <i data-lucide="arrow-right" className="w-5 h-5"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : activeData && activeData.id === 'kopachi-homestead' ? (
                        <KopachiDetailView data={activeData} onBack={handleBackToHome} onBook={handleBook} />
                    ) : activeData && activeData.id === 'marangu-sanctuary' ? (
                        <MaranguDetailView data={activeData} onBack={handleBackToHome} onBook={handleBook} />
                    ) : (
                        <DetailView data={activeData} onBack={handleBackToHome} onBook={handleBook} />
                    )}

                    <footer className="bg-black text-white py-32 text-center">
                        <h2 className="text-6xl font-serif mb-8 text-brand-gold tracking-widest">KOPACHI.</h2>
                        <p className="text-gray-400 mb-16 text-2xl font-light tracking-[0.4em] uppercase">Live. Explore. Impact.</p>
                        <p className="text-lg text-gray-600 tracking-widest uppercase">© 2026 Kopachi Tanzania. All rights reserved.</p>
                    </footer>

                    {modalOpen && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-6 bg-brand-dark/95 backdrop-blur-xl fade-enter" onClick={() => setModalOpen(false)}>
                            <div className="bg-white w-full max-w-3xl rounded-sm p-16 md:p-20 relative" onClick={e => e.stopPropagation()}>
                                <button type="button" onClick={() => setModalOpen(false)} className="absolute top-10 right-10 text-gray-400 hover:text-brand-dark transition-colors"><i data-lucide="x" className="w-10 h-10"></i></button>
                                <h3 className="text-5xl font-serif text-brand-dark mb-4">{modalItem.id === 'kopachi-homestead' ? "Karibu Nyumbani" : "Begin Your Journey"}</h3>
                                <p className="text-brand-earth font-bold mb-12 text-2xl tracking-widest uppercase">{modalItem.name}</p>
                                <form className="space-y-8" onSubmit={(e) => e.preventDefault()}>
                                    <input type="text" placeholder="Full Name" className="w-full bg-gray-50 border border-gray-200 p-6 rounded-sm focus:outline-none focus:border-brand-gold text-2xl" />
                                    <input type="email" placeholder="Email Address" className="w-full bg-gray-50 border border-gray-200 p-6 rounded-sm focus:outline-none focus:border-brand-gold text-2xl" />
                                    {modalItem.id === 'kopachi-homestead' ? (
                                        <select className="w-full bg-gray-50 border border-gray-200 p-6 rounded-sm focus:outline-none focus:border-brand-gold text-2xl text-gray-600">
                                            <option>Short Stay (Less than 1 week)</option>
                                            <option>Long Stay (1 Month+)</option>
                                            <option>Digital Nomad Package</option>
                                        </select>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-8">
                                            <input type="date" className="bg-gray-50 border border-gray-200 p-6 rounded-sm text-gray-500 text-2xl" />
                                            <input type="number" placeholder="Guests" className="bg-gray-50 border border-gray-200 p-6 rounded-sm text-2xl" />
                                        </div>
                                    )}
                                    <button type="submit" className="w-full bg-brand-dark text-brand-gold py-8 rounded-sm font-serif text-3xl tracking-wider hover:bg-brand-gold hover:text-brand-dark transition-colors mt-6 shadow-xl">Send Request</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
