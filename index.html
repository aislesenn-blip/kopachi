<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopachi | Live. Explore. Impact.</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0F1C18',
                            green: '#2D4A3E',
                            earth: '#967E66',
                            gold: '#C5A065',
                            cream: '#F5F5F0',
                            brick: '#BC5D41'
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F5F5F0; overflow-x: hidden; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .fade-enter { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 200px);
            gap: 1rem;
        }
        .gallery-item:first-child {
            grid-row: span 2;
            grid-column: span 2;
        }
        @media (min-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 250px); }
            .gallery-item:first-child { grid-column: span 2; grid-row: span 2; }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- UNSPLASH KEY ---
        const UNSPLASH_ACCESS_KEY = "GFRGVmxF64zpxZL22-o3BaVyGxphiGAwXLMfQxLCC2U";

        // --- 1. SMART HERO COMPONENT (Hii ndio inahakikisha picha ipo) ---
        const SmartHero = ({ children }) => {
            // Tunaanza na picha hii, ikigoma tunavuta nyingine kwa API
            const [bgImage, setBgImage] = useState("https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1600");

            const handleImageError = () => {
                console.log("Hero image failed, fetching fresh one from API...");
                // Fetch new Tanzania Sunrise image
                fetch(`https://api.unsplash.com/photos/random?query=tanzania%20sunrise%20landscape&orientation=landscape&client_id=${UNSPLASH_ACCESS_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.urls && data.urls.regular) {
                            setBgImage(data.urls.regular);
                        } else {
                            // Fallback ya mwisho kabisa isiyoweza kufa (Wikimedia)
                            setBgImage("https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Kilimanjaro_Mount.jpg/1280px-Kilimanjaro_Mount.jpg");
                        }
                    })
                    .catch(err => {
                        console.error("API Error", err);
                         setBgImage("https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Kilimanjaro_Mount.jpg/1280px-Kilimanjaro_Mount.jpg");
                    });
            };

            return (
                <div className="relative h-screen flex items-center justify-center overflow-hidden">
                    {/* The Background Image */}
                    <img
                        src={bgImage}
                        className="absolute inset-0 w-full h-full object-cover"
                        alt="Kopachi Sunrise"
                        onError={handleImageError}
                    />
                    {/* Dark Overlay */}
                    <div className="absolute inset-0 bg-black/40 z-10"></div>

                    {/* Content */}
                    <div className="relative z-20 w-full">
                        {children}
                    </div>

                    <div className="absolute bottom-10 animate-bounce text-white z-20 left-1/2 transform -translate-x-1/2">
                        <i data-lucide="chevrons-down" className="w-10 h-10"></i>
                    </div>
                </div>
            );
        };

        // --- 2. INTELLIGENT IMAGE (Kwa picha za ndani) ---
        const SafeImage = ({ src, alt, className, queryTerm = "tanzania nature" }) => {
            const [imgSrc, setImgSrc] = useState(src);

            const fetchReplacement = () => {
                fetch(`https://api.unsplash.com/photos/random?query=${queryTerm}&orientation=landscape&client_id=${UNSPLASH_ACCESS_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.urls && data.urls.regular) {
                            setImgSrc(data.urls.regular);
                        }
                    })
                    .catch(() => {
                        // Silent fail to a reliable placeholder
                    });
            };

            return <img src={imgSrc} alt={alt} className={className} onError={fetchReplacement} />;
        };

        // --- DATA SECTION ---
        const stays = [
            {
                id: 'kirua-homestead', type: 'stay', name: "The Kirua Homestead",
                tagline: "Don't Visit. Just Live.", location: "Kirua, Kilimanjaro", price: "$120/night",
                cover: "https://images.unsplash.com/photo-1623150646174-2792ae5ce998?w=1600",
                gallery: ["https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800", "https://images.unsplash.com/photo-1625641772076-234b6e51240c?w=800", "https://images.unsplash.com/photo-1517327370886-06900a649669?w=800", "https://images.unsplash.com/photo-1605553147575-4089c20a9a4b?w=800", "https://images.unsplash.com/photo-1598556636780-e34988f5728a?w=800", "https://images.unsplash.com/photo-1471696035578-3d8c78d99684?w=800"],
                features: ["Mt. Kilimanjaro View", "Organic Garden", "Fast WiFi", "Private Kitchen", "Community Access"],
                desc: "Located in the lush slopes of Kirua, this is a fully furnished home integrated into a welcoming Chagga family compound. You are not a guest; you are family.",
                details: [{ title: "Morning", desc: "Fresh brewed coffee from the garden." }, { title: "Daytime", desc: "Walk to the local market or hike waterfalls." }, { title: "Evening", desc: "Join the family for 'Machalari'." }]
            },
            {
                id: 'zanzibar-villa', type: 'stay', name: "Cliffside Villa",
                tagline: "Ocean Solitude.", location: "Nungwi, Zanzibar", price: "$450/night",
                cover: "https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?w=1600",
                gallery: ["https://images.unsplash.com/photo-1582719508461-905c673771fd?w=800", "https://images.unsplash.com/photo-1484154218962-a1c00207099b?w=800", "https://images.unsplash.com/photo-1590523741831-ab7e8b8f9c78?w=800", "https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=800"],
                features: ["Private Pool", "Chef", "Ocean Access"],
                desc: "A sanctuary perched on the coral cliffs. Designed for total privacy."
            }
        ];

        const destinations = [
            {
                id: 'serengeti', type: 'safari', name: "Serengeti National Park",
                tagline: "The Endless Plains.", query: "serengeti lion",
                cover: "https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1600",
                gallery: ["https://images.unsplash.com/photo-1535941339077-2dd1c7963098?w=800", "https://images.unsplash.com/photo-1547471080-7528185270d2?w=800", "https://images.unsplash.com/photo-1518599818837-1419a4059082?w=800"],
                details: [{ title: "Day 1", desc: "Arrival & Game Drive" }, { title: "Day 2", desc: "The Great Migration" }],
                desc: "Where the earth breathes. Witness the greatest show on earth."
            },
            {
                id: 'kilimanjaro', type: 'safari', name: "Mount Kilimanjaro",
                tagline: "Conquer the Roof of Africa.", query: "kilimanjaro mountain",
                cover: "https://images.unsplash.com/photo-1650638525049-c294101d2482?w=1600",
                gallery: ["https://images.unsplash.com/photo-1589553416260-f586c8f1514f?w=800", "https://images.unsplash.com/photo-1632756314605-1a8508e602be?w=800", "https://images.unsplash.com/photo-1605553147575-4089c20a9a4b?w=800"],
                details: [{ title: "Day 1", desc: "Rainforest Zone" }, { title: "Day 6", desc: "Summit Night" }],
                desc: "More than a climb. It's a spiritual journey to the top of the continent."
            }
        ];

        const projects = [
            {
                id: 'maasai-education', type: 'project', name: "Maasai Literacy Initiative",
                location: "Arusha", duration: "Min 2 Weeks",
                cover: "https://images.unsplash.com/photo-1489749798305-4fea3ae63d43?w=1600",
                gallery: ["https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?w=800", "https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?w=800"],
                tagline: "Teach. Learn. Exchange.",
                desc: "Don't just watch the culture, become part of the village future. Teach English or Math to eager young minds."
            }
        ];

        // --- COMPONENTS ---
        const Manifesto = ({ onSelectKirua }) => (
            <div className="bg-brand-green text-white py-24 px-6 relative overflow-hidden">
                <div className="container mx-auto text-center max-w-5xl relative z-10">
                    <h2 className="text-3xl md:text-5xl font-serif mb-12 leading-tight">
                        "We believe you don't just visit a place.<br/>You become part of its <span className="text-brand-gold italic">story</span>."
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-12 text-left">
                        <div onClick={() => document.getElementById('destinations').scrollIntoView({behavior:'smooth'})} className="bg-white/5 p-8 rounded-2xl border border-white/10 hover:border-brand-gold cursor-pointer transition-colors">
                            <i data-lucide="compass" className="w-10 h-10 text-brand-gold mb-6"></i>
                            <h3 className="text-xl font-bold mb-3">Explore</h3>
                            <p className="text-gray-300 font-light text-sm leading-relaxed">For those who want to see the giants. Serengeti, Kilimanjaro, and the wild corners of Tanzania.</p>
                        </div>
                        <div onClick={() => document.getElementById('impact').scrollIntoView({behavior:'smooth'})} className="bg-white/5 p-8 rounded-2xl border border-white/10 hover:border-brand-brick cursor-pointer transition-colors">
                            <i data-lucide="heart" className="w-10 h-10 text-brand-brick mb-6"></i>
                            <h3 className="text-xl font-bold mb-3">Impact</h3>
                            <p className="text-gray-300 font-light text-sm leading-relaxed">For those who want to give back. Teach, build, and conserve. Leave a legacy, not just footprints.</p>
                        </div>
                        <div onClick={onSelectKirua} className="bg-brand-gold/20 p-8 rounded-2xl border border-brand-gold cursor-pointer hover:bg-brand-gold/30 transition-colors">
                            <i data-lucide="coffee" className="w-10 h-10 text-brand-gold mb-6"></i>
                            <h3 className="text-xl font-bold mb-3 text-brand-gold">Just Live</h3>
                            <p className="text-gray-200 font-light text-sm leading-relaxed">Not interested in safaris? Tired of volunteering? <strong>Come to Kirua.</strong> Rent a home, meet the neighbors, breathe the mountain air. Be us.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const DetailView = ({ data, onBack, onBook }) => {
            useEffect(() => { window.scrollTo(0, 0); lucide.createIcons(); }, []);
            const isKirua = data.id === 'kirua-homestead';
            return (
                <div className="bg-brand-cream min-h-screen fade-enter">
                    <div className="h-[70vh] relative">
                        <SafeImage src={data.cover} alt={data.name} queryTerm={data.query || data.name} className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/40"></div>
                        <button onClick={onBack} className="absolute top-8 left-8 bg-white/10 backdrop-blur-md text-white px-6 py-2 rounded-full flex items-center gap-2 hover:bg-white hover:text-black transition-all z-20 border border-white/20">
                            <i data-lucide="arrow-left" className="w-5 h-5"></i> Back
                        </button>
                        <div className="absolute bottom-12 left-6 md:left-12 text-white max-w-4xl">
                            {isKirua && <span className="bg-brand-gold text-black px-4 py-1 text-sm font-bold uppercase tracking-widest mb-4 inline-block rounded-sm">Signature Experience</span>}
                            <h1 className="text-5xl md:text-8xl font-serif mb-4 leading-none">{data.name}</h1>
                            <p className="text-xl md:text-2xl text-white/90 font-light">{data.tagline}</p>
                            {isKirua && <p className="mt-4 text-brand-gold font-bold text-lg"><i data-lucide="map-pin" className="inline w-5 h-5"></i> {data.location} | {data.price}</p>}
                        </div>
                    </div>
                    <div className="container mx-auto px-6 py-16 grid grid-cols-1 lg:grid-cols-3 gap-16">
                        <div className="lg:col-span-2 space-y-16">
                            <div><h3 className="text-3xl font-serif text-brand-dark mb-6">The Essence</h3><p className="text-xl text-gray-700 leading-relaxed font-light">{data.desc}</p></div>
                            {data.details && (<div><h3 className="text-2xl font-serif text-brand-dark mb-6">{isKirua ? "A Day in Kirua Life" : "Experience Highlights"}</h3><div className="space-y-6">{data.details.map((d, i) => (<div key={i} className="flex gap-4"><div className="w-12 h-12 rounded-full bg-brand-green/10 flex items-center justify-center text-brand-green font-bold shrink-0">{i + 1}</div><div><h4 className="font-bold text-brand-dark text-lg">{d.title}</h4><p className="text-gray-600 leading-relaxed">{d.desc}</p></div></div>))}</div></div>)}
                            <div><h3 className="text-3xl font-serif text-brand-dark mb-8">Visual Journey</h3><div className="gallery-grid">{data.gallery.map((img, i) => (<div key={i} className="gallery-item relative overflow-hidden rounded-lg group"><SafeImage src={img} alt={`Gallery ${i}`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" /><div className="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div></div>))}</div></div>
                        </div>
                        <div className="relative"><div className="sticky top-12 bg-white p-10 rounded-2xl shadow-2xl border border-gray-100"><h3 className="text-3xl font-serif text-brand-dark mb-2">{isKirua ? "Move In." : "Book This."}</h3><p className="text-gray-500 mb-8">{isKirua ? "Short term or Long term. Become a local." : "Customizable dates & private guides."}</p><button onClick={() => onBook(data)} className="w-full bg-brand-green text-white py-5 rounded-xl font-bold text-lg hover:bg-brand-gold transition-colors shadow-lg mb-4 flex justify-center items-center gap-2">{isKirua ? "Check Availability" : "Request Quote"} <i data-lucide="arrow-right" className="w-5 h-5"></i></button></div></div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [activeData, setActiveData] = useState(null);
            const [modalOpen, setModalOpen] = useState(false);
            const [modalItem, setModalItem] = useState(null);

            useEffect(() => lucide.createIcons());

            const handleSelect = (item) => { setActiveData(item); setView('detail'); };
            const handleBook = (item) => { setModalItem(item); setModalOpen(true); };
            const openKirua = () => { handleSelect(stays.find(s => s.id === 'kirua-homestead')); };

            return (
                <div className="antialiased text-gray-800 font-sans">
                    {view === 'home' ? (
                        <div className="fade-enter">
                            {/* SMART HERO: Ensures background image loads */}
                            <SmartHero>
                                <div className="text-center text-white px-4">
                                    <h1 className="text-7xl md:text-[10rem] font-serif mb-2 tracking-tighter drop-shadow-xl">KOPACHI.</h1>
                                    <p className="text-xl md:text-3xl font-light tracking-[0.2em] uppercase mt-2 mb-10 drop-shadow-md">Live. Explore. Impact.</p>
                                    <div className="flex flex-col md:flex-row gap-6 justify-center items-center">
                                        <button onClick={() => document.getElementById('destinations').scrollIntoView({behavior:'smooth'})} className="bg-brand-gold text-brand-dark px-10 py-4 rounded-full font-bold text-lg hover:bg-white transition-all transform hover:scale-105 shadow-xl">I Want to Explore</button>
                                        <button onClick={() => document.getElementById('impact').scrollIntoView({behavior:'smooth'})} className="border-2 border-white text-white px-10 py-4 rounded-full font-bold text-lg hover:bg-white hover:text-brand-green transition-all backdrop-blur-sm shadow-md">I Want to Volunteer</button>
                                    </div>
                                    <p onClick={openKirua} className="mt-8 text-white/80 text-sm cursor-pointer hover:text-brand-gold transition-colors border-b border-transparent hover:border-brand-gold inline-block pb-1 drop-shadow-sm">Or just looking for a home? Click here.</p>
                                </div>
                            </SmartHero>

                            <Manifesto onSelectKirua={openKirua} />

                            <div className="py-24 bg-white px-6">
                                <div className="container mx-auto">
                                    <div className="flex flex-col md:flex-row justify-between items-end mb-12"><div><span className="text-brand-earth uppercase tracking-widest text-sm font-bold">Accommodation</span><h2 className="text-4xl md:text-5xl font-serif text-brand-dark mt-2">Kopachi Homes & Community Stays</h2></div></div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10">{stays.map(stay => (<div key={stay.id} onClick={() => handleSelect(stay)} className="cursor-pointer group"><div className="h-[400px] overflow-hidden rounded-2xl mb-6 relative shadow-lg"><SafeImage src={stay.cover} alt={stay.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" /><div className="absolute top-6 left-6 bg-white/90 px-4 py-2 rounded-lg text-sm font-bold text-brand-dark shadow-sm">{stay.price}</div>{stay.id === 'kirua-homestead' && (<div className="absolute bottom-6 left-6 bg-brand-gold px-4 py-2 rounded-lg text-sm font-bold text-black shadow-sm">Signature Experience</div>)}</div><h3 className="text-3xl font-serif text-brand-dark group-hover:text-brand-earth transition-colors">{stay.name}</h3><p className="text-gray-500 mt-2 flex items-center"><i data-lucide="map-pin" className="w-4 h-4 mr-2"></i> {stay.location}</p></div>))}</div>
                                </div>
                            </div>

                            <div id="destinations" className="py-24 bg-brand-cream px-6">
                                <div className="container mx-auto">
                                    <h2 className="text-4xl font-serif text-brand-dark mb-12 text-center">Expeditions</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">{destinations.map(dest => (<div key={dest.id} onClick={() => handleSelect(dest)} className="h-[500px] relative rounded-xl overflow-hidden cursor-pointer group"><SafeImage src={dest.cover} alt={dest.name} queryTerm={dest.query || dest.name} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" /><div className="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div><div className="absolute bottom-8 left-8 text-white"><h3 className="text-3xl font-serif">{dest.name}</h3><p className="text-brand-gold mt-2">{dest.tagline}</p></div></div>))}</div>
                                </div>
                            </div>

                            <div id="impact" className="py-24 bg-brand-dark text-white px-6">
                                <div className="container mx-auto">
                                    <h2 className="text-4xl font-serif text-center mb-16"><span className="text-brand-brick">Give Back.</span> Join a Project.</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">{projects.map(proj => (<div key={proj.id} onClick={() => handleSelect(proj)} className="bg-white/5 border border-white/10 rounded-xl overflow-hidden hover:border-brand-brick transition-all cursor-pointer"><div className="h-64 overflow-hidden"><SafeImage src={proj.cover} alt={proj.name} className="w-full h-full object-cover" /></div><div className="p-8"><h3 className="text-2xl font-serif mb-2">{proj.name}</h3><p className="text-gray-400 text-sm line-clamp-3">{proj.desc}</p><button className="mt-6 text-brand-brick font-bold uppercase text-xs tracking-widest">View Project &rarr;</button></div></div>))}</div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <DetailView data={activeData} onBack={() => setView('home')} onBook={handleBook} />
                    )}

                    <footer className="bg-black text-white py-16 text-center border-t border-white/10 mt-0">
                        <h2 className="text-4xl font-serif mb-4">KOPACHI.</h2>
                        <p className="text-gray-500 mb-8">Tanzania</p>
                        <p className="text-xs text-gray-700">© 2026 Kopachi. All rights reserved.</p>
                    </footer>

                    {modalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/90 backdrop-blur-md" onClick={() => setModalOpen(false)}>
                            <div className="bg-white w-full max-w-lg rounded-2xl p-8 relative" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setModalOpen(false)} className="absolute top-4 right-4 text-gray-400 hover:text-black"><i data-lucide="x"></i></button>
                                <h3 className="text-2xl font-serif text-brand-dark mb-1">{modalItem.id === 'kirua-homestead' ? "Karibu Nyumbani" : "Start Planning"}</h3>
                                <p className="text-brand-earth font-bold mb-6">{modalItem.name}</p>
                                <form className="space-y-4">
                                    <input type="text" placeholder="Your Name" className="w-full bg-gray-50 border-none p-4 rounded-lg" />
                                    <input type="email" placeholder="Email Address" className="w-full bg-gray-50 border-none p-4 rounded-lg" />
                                    {modalItem.id === 'kirua-homestead' ? (<select className="w-full bg-gray-50 border-none p-4 rounded-lg"><option>Short Stay (Less than 1 week)</option><option>Long Stay (1 Month+)</option><option>Digital Nomad Package</option></select>) : (<div className="grid grid-cols-2 gap-4"><input type="date" className="bg-gray-50 border-none p-4 rounded-lg" /><input type="number" placeholder="Guests" className="bg-gray-50 border-none p-4 rounded-lg" /></div>)}
                                    <button className="w-full bg-brand-dark text-white py-4 rounded-lg font-bold hover:bg-brand-gold hover:text-black transition-colors">Send Request</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
