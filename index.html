    <style>
        body { background-color: #F5F5F0; overflow-x: hidden; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

            grid-column: span 2;

<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- UNSPLASH KEY ---
        const UNSPLASH_ACCESS_KEY = "GFRGVmxF64zpxZL22-o3BaVyGxphiGAwXLMfQxLCC2U";

        // --- 1. SMART HERO COMPONENT (Hii ndio inahakikisha picha ipo) ---
        const SmartHero = ({ children }) => {
            // Tunaanza na picha hii, ikigoma tunavuta nyingine kwa API
            const [bgImage, setBgImage] = useState("https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1600");

            const handleImageError = () => {
                console.log("Hero image failed, fetching fresh one from API...");
                // Fetch new Tanzania Sunrise image
                fetch(`https://api.unsplash.com/photos/random?query=tanzania%20sunrise%20landscape&orientation=landscape&client_id=${UNSPLASH_ACCESS_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.urls && data.urls.regular) {
                            setBgImage(data.urls.regular);
                        } else {
                            // Fallback ya mwisho kabisa isiyoweza kufa (Wikimedia)
                            setBgImage("https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Kilimanjaro_Mount.jpg/1280px-Kilimanjaro_Mount.jpg");
                        }
                    })
                    .catch(err => {
                        console.error("API Error", err);
                         setBgImage("https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Kilimanjaro_Mount.jpg/1280px-Kilimanjaro_Mount.jpg");
                    });
            };

            return (
                <div className="relative h-screen flex items-center justify-center overflow-hidden">
                    {/* The Background Image */}
                    <img
                        src={bgImage}
                        className="absolute inset-0 w-full h-full object-cover"
                        alt="Kopachi Sunrise"
                        onError={handleImageError}
                    />
                    {/* Dark Overlay */}
                    <div className="absolute inset-0 bg-black/40 z-10"></div>

                    {/* Content */}
                    <div className="relative z-20 w-full">
                        {children}
                    </div>

                    <div className="absolute bottom-10 animate-bounce text-white z-20 left-1/2 transform -translate-x-1/2">
                        <i data-lucide="chevrons-down" className="w-10 h-10"></i>
                    </div>
                </div>
            );
        };

        // --- 2. INTELLIGENT IMAGE (Kwa picha za ndani) ---
        const DynamicImageSlot = ({ images, className }) => {
            const [currentIndex, setCurrentIndex] = useState(0);

            useEffect(() => {
                if (!images || images.length <= 1) return;
                const interval = setInterval(() => {
                    setCurrentIndex((prevIndex) => (prevIndex + 1) % images.length);
                }, 4000 + Math.random() * 2000); // 4-6 seconds, slightly randomized for a staggered feel
                return () => clearInterval(interval);
            }, [images]);

            if (!images || images.length === 0) return null;

            return (
                <div className={`relative overflow-hidden ${className}`}>
                    {images.map((img, index) => (
                        <div
                            key={index}
                            className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${index === currentIndex ? 'opacity-100' : 'opacity-0'}`}
                        >
                            <SafeImage src={img.src} alt={img.alt || 'Kopachi View'} queryTerm={img.queryTerm || "tanzania luxury"} className="w-full h-full object-cover" />
                        </div>
                    ))}
                    {/* Placeholder to maintain dimensions if not explicitly set via className */}
                    <div className="relative opacity-0 pointer-events-none">
                       <SafeImage src={images[0].src} alt={images[0].alt || 'Kopachi View'} queryTerm={images[0].queryTerm || "tanzania luxury"} className="w-full h-auto object-cover" />
                    </div>
                </div>
            );
        };

        const SafeImage = ({ src, alt, className, queryTerm = "tanzania nature" }) => {
            const [imgSrc, setImgSrc] = useState(src);

            const fetchReplacement = () => {
                fetch(`https://api.unsplash.com/photos/random?query=${queryTerm}&orientation=landscape&client_id=${UNSPLASH_ACCESS_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.urls && data.urls.regular) {
                            setImgSrc(data.urls.regular);
                        }
                    })
                    .catch(() => {
                        // Silent fail to a reliable placeholder
                    });
            };

            return <img src={imgSrc} alt={alt} className={className} onError={fetchReplacement} />;
        };

        // --- DATA SECTION ---
        const stays = [
            {
                id: 'kirua-homestead', type: 'stay', name: "The Kirua Homestead",
                tagline: "Don't Visit. Just Live.", location: "Kirua, Kilimanjaro", price: "$120/night",

                    "./KIRUA/3K6D5646.JPG", "./KIRUA/3K6D5652.JPG", "./KIRUA/3K6D5655.JPG"

                features: [],
                desc: "The Marangu Sanctuary",
                fullGallery: [
                    "./images/3K6D5825.JPG", "./images/3K6D5829.JPG", "./images/3K6D5830.JPG",
                    "./images/3K6D5833.JPG", "./images/3K6D5837.JPG", "./images/3K6D5841.JPG",

                ]

        ];

        const destinations = [
            {
                id: 'serengeti', type: 'safari', name: "Serengeti National Park",
                tagline: "The Endless Plains.", query: "serengeti lion",
                cover: "https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1600",
                gallery: ["https://images.unsplash.com/photo-1535941339077-2dd1c7963098?w=800", "https://images.unsplash.com/photo-1547471080-7528185270d2?w=800", "https://images.unsplash.com/photo-1518599818837-1419a4059082?w=800"],

                cover: "https://images.unsplash.com/photo-1650638525049-c294101d2482?w=1600",
                gallery: ["https://images.unsplash.com/photo-1589553416260-f586c8f1514f?w=800", "https://images.unsplash.com/photo-1632756314605-1a8508e602be?w=800", "https://images.unsplash.com/photo-1605553147575-4089c20a9a4b?w=800"],

        const projects = [
            {

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-12 text-left">

                        </div>
                        <div onClick={() => document.getElementById('impact').scrollIntoView({behavior:'smooth'})} className="bg-white/5 p-8 rounded-2xl border border-white/10 hover:border-brand-brick cursor-pointer transition-colors">
                            <i data-lucide="heart" className="w-10 h-10 text-brand-brick mb-6"></i>
                            <h3 className="text-xl font-bold mb-3">Impact</h3>
                            <p className="text-gray-300 font-light text-sm leading-relaxed">For those who want to give back. Teach, build, and conserve. Leave a legacy, not just footprints.</p>
                        </div>
                        <div onClick={onSelectKirua} className="bg-brand-gold/20 p-8 rounded-2xl border border-brand-gold cursor-pointer hover:bg-brand-gold/30 transition-colors">
                            <i data-lucide="coffee" className="w-10 h-10 text-brand-gold mb-6"></i>
                            <h3 className="text-xl font-bold mb-3 text-brand-gold">Just Live</h3>
                            <p className="text-gray-200 font-light text-sm leading-relaxed">Not interested in safaris? Tired of volunteering? <strong>Come to Kirua.</strong> Rent a home, meet the neighbors, breathe the mountain air. Be us.</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- FULLSCREEN MASONRY GALLERY ---
        const FullscreenMasonryGallery = ({ images, isOpen, onClose, title }) => {
            useEffect(() => {
                if (isOpen) {
                    lucide.createIcons();
                    const handleKeyDown = (e) => {
                        if (e.key === 'Escape') onClose();
                    };
                    window.addEventListener('keydown', handleKeyDown);
                    document.body.style.overflow = 'hidden';
                    return () => {
                        window.removeEventListener('keydown', handleKeyDown);
                        document.body.style.overflow = 'auto';
                    };
                }
            }, [isOpen, onClose]);

            if (!isOpen || !images || images.length === 0) return null;

            return (
                <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl overflow-y-auto no-scrollbar">
                    <div className="sticky top-0 w-full z-10 flex justify-between items-center p-6 bg-gradient-to-b from-black/80 to-transparent">

                                        <SafeImage src={img.src} alt={img.alt || `Gallery Image ${index}`} queryTerm={img.queryTerm || "tanzania luxury travel"} className="w-full h-auto object-cover transition-transform duration-1000 group-hover:scale-[1.03]" />

                // Simple scroll observer for staggering animations
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate-reveal');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
                return () => observer.disconnect();

            return (

                            <i data-lucide="image" className="w-5 h-5"></i> Explore the Homestead

                        </p>
                    </div>

                    {/* ASYMMETRICAL IMAGES - L8 Dynamic Slots */}
                    <div className="container mx-auto px-6 py-12">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

                                        { src: "./KIRUA/3K6D5585.JPG", alt: "Kirua Space", queryTerm: "elegant home" },
                                        { src: "./KIRUA/3K6D5588.JPG", alt: "Kirua Interior", queryTerm: "rustic interior" }
                                    ]}
                                    className="w-full h-full rounded-sm shadow-xl"
                                />

                            <div className="w-full h-[50vh] md:h-[70vh] md:ml-12 md:mt-24 reveal-on-scroll" style={{ transitionDelay: '0.4s' }}>

                                        { src: "./KIRUA/3K6D5607.JPG", alt: "Kirua Decor", queryTerm: "beautiful bedding" }
                                    ]}
                                    className="w-full h-full rounded-sm shadow-2xl"

                                    {modalItem.id === 'kirua-homestead' ? (<select className="w-full bg-gray-50 border-none p-4 rounded-lg"><option>Short Stay (Less than 1 week)</option><option>Long Stay (1 Month+)</option><option>Immersive Sabbatical Package</option></select>) : (<div className="grid grid-cols-2 gap-4"><input type="date" className="bg-gray-50 border-none p-4 rounded-lg" /><input type="number" placeholder="Guests" className="bg-gray-50 border-none p-4 rounded-lg" /></div>)}
                                    <button className="w-full bg-brand-dark text-white py-4 rounded-lg font-bold hover:bg-brand-gold hover:text-black transition-colors">Send Request</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
