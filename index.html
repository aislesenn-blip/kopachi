        const MasonryGallery = ({ images, onClose, initialIndex = 0 }) => {
            const [selectedIndex, setSelectedIndex] = useState(initialIndex);

            useEffect(() => {
                lucide.createIcons();
                const handleKeyDown = (e) => { 
                    if (e.key === 'Escape') {
                        onClose();
                    }
                    if (e.key === 'ArrowRight') setSelectedIndex(prev => (prev + 1) % images.length);
                    if (e.key === 'ArrowLeft') setSelectedIndex(prev => (prev === 0 ? images.length - 1 : prev - 1));

                window.addEventListener('keydown', handleKeyDown);
                document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', handleKeyDown); document.body.style.overflow = 'auto'; };

            useEffect(() => {
                const timer = setTimeout(() => {
                    const observer = new IntersectionObserver((entries, obs) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('animate-reveal');
                                obs.unobserve(entry.target); // Performance boost: stop observing once revealed
                            }
                        });
                    }, { threshold: 0.1 });
                    
                    document.querySelectorAll('.reveal-on-scroll').forEach(el => {
                        el.classList.remove('animate-reveal'); // Reset completely
                        observer.observe(el);
                    });
                    
                    return () => observer.disconnect();
                }, 100);
                return () => clearTimeout(timer);
            }, deps);

                        <MaranguDetailView data={activeData} onBack={handleBackToHome} onBook={handleBook} />
                    ) : (
                        <DetailView data={activeData} onBack={handleBackToHome} onBook={handleBook} />
                    )}

                    <footer className="bg-black text-white py-16 md:py-24 text-center px-6">
                        <h2 className="text-3xl md:text-5xl font-serif mb-4 md:mb-6 text-brand-gold tracking-widest">KOPACHI.</h2>
                        <p className="text-gray-400 mb-8 md:mb-12 text-base md:text-xl font-light tracking-[0.3em] uppercase">Live. Explore. Impact.</p>
                        <p className="text-xs md:text-sm text-gray-600 tracking-widest uppercase">© 2026 Kopachi Tanzania. All rights reserved.</p>
                    </footer>

                    {modalOpen && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-brand-dark/95 backdrop-blur-xl fade-enter overflow-y-auto" onClick={() => setModalOpen(false)}>
                            <div className="bg-white w-full max-w-2xl rounded-sm p-6 md:p-12 lg:p-16 relative my-auto" onClick={e => e.stopPropagation()}>
                                <button type="button" onClick={() => setModalOpen(false)} className="absolute top-4 right-4 md:top-8 md:right-8 text-gray-400 hover:text-brand-dark transition-colors"><i data-lucide="x" className="w-6 h-6 md:w-8 md:h-8"></i></button>
                                <h3 className="text-3xl md:text-4xl font-serif text-brand-dark mb-2 pr-8">{modalItem.id === 'kirua-homestead' ? "Karibu Nyumbani" : "Begin Your Journey"}</h3>
                                <p className="text-brand-earth font-bold mb-6 md:mb-10 text-sm md:text-xl tracking-widest uppercase">{modalItem.name}</p>
                                <form className="space-y-4 md:space-y-6" onSubmit={(e) => e.preventDefault()}>
                                    <input type="text" placeholder="Full Name" className="w-full bg-gray-50 border border-gray-200 p-4 md:p-5 rounded-sm focus:outline-none focus:border-brand-gold text-base md:text-lg" />
                                    <input type="email" placeholder="Email Address" className="w-full bg-gray-50 border border-gray-200 p-4 md:p-5 rounded-sm focus:outline-none focus:border-brand-gold text-base md:text-lg" />
                                    {modalItem.id === 'kirua-homestead' ? (
                                        <select className="w-full bg-gray-50 border border-gray-200 p-4 md:p-5 rounded-sm focus:outline-none focus:border-brand-gold text-base md:text-lg text-gray-600">
                                            <option>Short Stay (Less than 1 week)</option>
                                            <option>Long Stay (1 Month+)</option>
                                            <option>Digital Nomad Package</option>
                                        </select>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                            <input type="date" className="bg-gray-50 border border-gray-200 p-4 md:p-5 rounded-sm text-gray-500 text-base md:text-lg w-full" />
                                            <input type="number" placeholder="Guests" className="bg-gray-50 border border-gray-200 p-4 md:p-5 rounded-sm text-base md:text-lg w-full" />
                                        </div>
                                    )}
                                    <button type="submit" className="w-full bg-brand-dark text-brand-gold py-4 md:py-6 rounded-sm font-serif text-xl md:text-2xl tracking-wider hover:bg-brand-gold hover:text-brand-dark transition-colors mt-2 md:mt-4 shadow-xl">Send Request</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
